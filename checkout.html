<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結帳｜建良鵝肉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <div id="siteHeader"></div>

  <section class="page-header">
    <div class="eyebrow">Checkout</div>
    <h1>結帳</h1>
    <p>填寫收件與付款資訊，完成訂單</p>
  </section>

  <section class="section">
    <div class="container">
      <div id="checkoutContent">
        <div style="text-align:center; padding: 60px; color: var(--ink-mute);">
          <span class="spinner" style="border-color: rgba(0,0,0,.15); border-top-color: var(--primary);"></span>
          <p style="margin-top: 12px;">載入中...</p>
        </div>
      </div>
    </div>
  </section>

  <div id="siteFooter"></div>

  <script src="data.js"></script>
  <script src="js/main.js?v=3"></script>
  <script src="js/shop.js?v=3"></script>
  <script src="js/cvs-picker.js?v=1"></script>
  <script>
    let allProducts = [];
    let shopSettings = {};
    let storePicker = null;

    // 付款資訊由後台「設定」頁管理；收款碼沒設定時，結帳頁就不顯示該付款方式
    function payConfig() {
      return {
        bankName: shopSetting(shopSettings, 'bank_name', '凱基銀行'),
        bankCode: shopSetting(shopSettings, 'bank_code', '809'),
        bankAccount: shopSetting(shopSettings, 'bank_account', '0005-95-3239840-6'),
        bankHolder: shopSetting(shopSettings, 'bank_holder', '林宛儒'),
        jkoQr: shopSetting(shopSettings, 'jko_qr', 'images/pay-jkopay.jpg'),
        linepayQr: shopSetting(shopSettings, 'linepay_qr', ''),
      };
    }

    function payQrHtml(src, label) {
      return `<img src="${escapeHtml(imagePath(src))}" alt="建良鵝肉 ${label} 收款 QR Code">`;
    }

    function numSetting(key, fallback) {
      const n = Number(shopSetting(shopSettings, key, ''));
      return shopSetting(shopSettings, key, '') !== '' && !isNaN(n) ? n : fallback;
    }

    function buildLines() {
      const cart = getCart();
      return Object.entries(cart).map(([id, qty]) => {
        const p = findProduct(allProducts, id);
        if (!p) return null;
        const unit = effectivePrice(p);
        return { p, qty: parseInt(qty) || 0, unit, lineTotal: unit * (parseInt(qty) || 0) };
      }).filter(Boolean);
    }

    function calcTotals(lines, deliveryMethod) {
      const subTotal = lines.reduce((s, l) => s + l.lineTotal, 0);
      const threshold = numSetting('shipping_threshold', 3000);
      const shippingFee = numSetting('shipping_fee', 120);
      let ship = 0;
      if (deliveryMethod === 'shipping') {
        ship = subTotal >= threshold ? 0 : shippingFee;
      }
      return { subTotal, threshold, shippingFee, ship, grandTotal: subTotal + ship };
    }

    function renderEmpty() {
      document.getElementById('checkoutContent').innerHTML = `
        <div class="empty-state">
          <div class="icon">🛒</div>
          <h3>購物車是空的</h3>
          <p>請先加入商品再結帳。</p>
          <a href="products.html" class="btn btn-primary">前往選購</a>
        </div>`;
    }

    function renderClosed() {
      const msg = shopSetting(shopSettings, 'closed_message', '') || '目前暫停接單，造成不便敬請見諒。';
      document.getElementById('checkoutContent').innerHTML = `
        <div class="empty-state">
          <div class="icon">🙏</div>
          <h3>目前暫停接單</h3>
          <p style="white-space: pre-line;">${escapeHtml(msg)}</p>
          <a href="https://lin.ee/uLbdSkD" target="_blank" class="btn btn-primary">LINE 詢問</a>
        </div>`;
    }

    function renderCheckout() {
      if (!shopIsOpen(shopSettings)) { renderClosed(); return; }
      const lines = buildLines();
      if (!lines.length) { renderEmpty(); return; }
      const pay = payConfig();

      document.getElementById('checkoutContent').innerHTML = `
        <form id="checkoutForm" class="cart-layout">
          <div>
            <!-- 訂購人資料 -->
            <div class="form-card">
              <h2>訂購人資料</h2>
              <div class="card-desc">我們會用此資料聯繫對帳與配送通知。</div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">姓名 <span class="required">*</span></label>
                  <input type="text" class="form-input" id="customerName" required placeholder="王小明">
                </div>
                <div class="form-group">
                  <label class="form-label">手機 <span class="required">*</span></label>
                  <input type="tel" class="form-input" id="customerPhone" required placeholder="0912-345-678" pattern="[0-9\\-\\s]{8,}">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Email（選填，將用於寄送收據）</label>
                <input type="email" class="form-input" id="customerEmail" placeholder="example@mail.com">
              </div>
            </div>

            <!-- 取貨方式 -->
            <div class="form-card">
              <h2>取貨方式</h2>
              <div class="card-desc">超商冷凍店到店免低溫運費，現場自取免運。</div>
              <div class="radio-group">
                <label class="radio-tile selected" data-delivery="shipping">
                  <input type="radio" name="deliveryMethod" value="shipping" checked>
                  <div class="tile-text">
                    <div class="tile-title">超商冷凍店到店</div>
                    <div class="tile-sub">7-11 / 全家 ・ 滿 ${numSetting('shipping_threshold', 3000).toLocaleString()} 免運</div>
                  </div>
                </label>
                <label class="radio-tile" data-delivery="self">
                  <input type="radio" name="deliveryMethod" value="self">
                  <div class="tile-text">
                    <div class="tile-title">現場自取</div>
                    <div class="tile-sub">新竹光復路門市 ・ 永遠免運</div>
                  </div>
                </label>
              </div>

              <!-- 超商配送資訊 -->
              <div id="shippingFields" style="margin-top: 18px;">
                <div class="form-group">
                  <label class="form-label">超商系統</label>
                  <div class="radio-group">
                    <label class="radio-tile selected" data-store="familymart" style="flex: 1;">
                      <input type="radio" name="storeType" value="familymart" checked>
                      <div class="tile-text">
                        <div class="tile-title">全家 FamilyMart</div>
                      </div>
                    </label>
                    <label class="radio-tile" data-store="711" style="flex: 1;">
                      <input type="radio" name="storeType" value="711">
                      <div class="tile-text">
                        <div class="tile-title">7-11</div>
                      </div>
                    </label>
                  </div>
                </div>
                <div class="form-group store-picker" id="storePicker"></div>
                <div class="form-group">
                  <label class="form-label">收件人姓名（如同訂購人可留空）</label>
                  <input type="text" class="form-input" id="receiverName" placeholder="同訂購人">
                </div>
              </div>

              <!-- 自取資訊 -->
              <div id="selfFields" style="margin-top: 18px; display: none;">
                <div class="form-group">
                  <label class="form-label">預計自取時間 <span class="required">*</span></label>
                  <input type="text" class="form-input" id="pickupTime" placeholder="例如：3/15 下午3點、週六傍晚">
                  <div class="form-help">📍 自取地點：300 新竹市東區光復路一段230號</div>
                </div>
              </div>
            </div>

            <!-- 付款方式 -->
            <div class="form-card">
              <h2>付款方式</h2>
              <div class="card-desc">本店採先付款、後出貨，超商取貨不提供貨到付款。付款後請填寫下方資訊，我們確認款項後就會安排出貨。</div>
              <div class="radio-group">
                <label class="radio-tile selected" data-payment="atm">
                  <input type="radio" name="paymentMethod" value="atm" checked>
                  <div class="tile-text">
                    <div class="tile-title">ATM 轉帳</div>
                    <div class="tile-sub">${escapeHtml(pay.bankName)} ・ 轉帳後填寫末 5 碼</div>
                  </div>
                </label>
                ${pay.jkoQr ? `
                <label class="radio-tile" data-payment="jko">
                  <input type="radio" name="paymentMethod" value="jko">
                  <div class="tile-text">
                    <div class="tile-title">街口支付</div>
                    <div class="tile-sub">掃描 QR Code 付款</div>
                  </div>
                </label>` : ''}
                ${pay.linepayQr ? `
                <label class="radio-tile" data-payment="linepay">
                  <input type="radio" name="paymentMethod" value="linepay">
                  <div class="tile-text">
                    <div class="tile-title">LINE Pay</div>
                    <div class="tile-sub">掃描 QR Code 付款</div>
                  </div>
                </label>` : ''}
              </div>

              <!-- ATM info -->
              <div id="atmFields" style="margin-top: 18px;">
                <div class="payment-info-box">
                  <div><strong>🏦 ${escapeHtml(pay.bankName)}（代碼 ${escapeHtml(pay.bankCode)}）</strong></div>
                  <div class="account-row">
                    <span>帳號：</span>
                    <span class="account-num" id="bankAcc">${escapeHtml(pay.bankAccount)}</span>
                    <button type="button" class="copy-btn" data-copy-account>📋 複製</button>
                  </div>
                  <div>戶名：<strong>${escapeHtml(pay.bankHolder)}</strong></div>
                </div>
                <div class="form-row" style="margin-top: 14px;">
                  <div class="form-group">
                    <label class="form-label">轉帳帳號末 5 碼 <span class="required">*</span></label>
                    <input type="text" class="form-input" id="atmLast5" placeholder="12345" maxlength="5" pattern="[0-9]{5}">
                  </div>
                  <div class="form-group">
                    <label class="form-label">轉帳日期 <span class="required">*</span></label>
                    <input type="date" class="form-input" id="atmDate">
                  </div>
                </div>
              </div>

              <!-- 街口支付 -->
              <div id="jkoFields" style="margin-top: 18px; display: none;">
                <div class="payment-info-box pay-qr">
                  ${pay.jkoQr ? payQrHtml(pay.jkoQr, '街口支付') : ''}
                  <div>
                    <div><strong>📱 街口支付</strong></div>
                    <div>請掃描 QR Code，或截圖後於街口 APP 內掃描完成付款。</div>
                  </div>
                </div>
                <div class="form-row" style="margin-top: 14px;">
                  <div class="form-group">
                    <label class="form-label">街口帳號 / 暱稱 <span class="required">*</span></label>
                    <input type="text" class="form-input" id="jkoAccount" placeholder="您的街口帳號或暱稱">
                  </div>
                  <div class="form-group">
                    <label class="form-label">付款日期 <span class="required">*</span></label>
                    <input type="date" class="form-input" id="jkoDate">
                  </div>
                </div>
              </div>

              <!-- LINE Pay -->
              <div id="linepayFields" style="margin-top: 18px; display: none;">
                <div class="payment-info-box pay-qr">
                  ${pay.linepayQr ? payQrHtml(pay.linepayQr, 'LINE Pay') : ''}
                  <div>
                    <div><strong>📱 LINE Pay</strong></div>
                    <div>請掃描 QR Code，或截圖後於 LINE Pay 內掃描完成付款。</div>
                  </div>
                </div>
                <div class="form-row" style="margin-top: 14px;">
                  <div class="form-group">
                    <label class="form-label">LINE 顯示名稱 <span class="required">*</span></label>
                    <input type="text" class="form-input" id="linepayName" placeholder="付款時的 LINE 名稱">
                  </div>
                  <div class="form-group">
                    <label class="form-label">付款日期 <span class="required">*</span></label>
                    <input type="date" class="form-input" id="linepayDate">
                  </div>
                </div>
              </div>
            </div>

            <!-- 訂單備註 -->
            <div class="form-card">
              <h2>訂單備註（選填）</h2>
              <div class="form-group">
                <textarea class="form-textarea" id="orderNote" placeholder="例如：收件人聯絡時段、特殊需求…"></textarea>
              </div>
            </div>
          </div>

          <!-- 訂單摘要 -->
          <aside class="cart-summary">
            <h3>訂單摘要</h3>
            <div class="summary-items-list" id="summaryItems"></div>
            <div class="checkout-summary-row"><span>商品小計</span><span id="sumSub">$0</span></div>
            <div class="checkout-summary-row"><span>運費</span><span id="sumShip">$0</span></div>
            <div class="checkout-summary-row total"><span>總計</span><span id="sumTotal">$0</span></div>
            <div class="summary-note" id="shipNote"></div>

            <div style="margin-top: 18px;">
              <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitOrderBtn">確認下單</button>
              <a href="cart.html" style="display:block; text-align:center; margin-top: 12px; color: var(--ink-mute); font-size: 0.9rem;">← 回購物車</a>
            </div>
            <div style="font-size: 0.78rem; color: var(--ink-mute); text-align: center; margin-top: 14px; line-height: 1.6;">
              送出訂單即代表您同意我們<br>使用您的資料進行訂單聯繫與核對。
            </div>
          </aside>
        </form>
      `;

      // Wire up the form
      wireForm(lines);
    }

    function wireForm(lines) {
      // Radio tile selection
      function bindRadios(name, onChange) {
        document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
          r.addEventListener('change', () => {
            document.querySelectorAll(`input[name="${name}"]`).forEach(rr => {
              const tile = rr.closest('.radio-tile');
              if (tile) tile.classList.toggle('selected', rr.checked);
            });
            if (onChange) onChange(r.value);
          });
        });
      }

      const shippingFields = document.getElementById('shippingFields');
      const selfFields = document.getElementById('selfFields');
      const payFields = {
        atm: document.getElementById('atmFields'),
        jko: document.getElementById('jkoFields'),
        linepay: document.getElementById('linepayFields'),
      };

      document.querySelector('[data-copy-account]').addEventListener('click', e => {
        copyToClipboard(payConfig().bankAccount, e.currentTarget);
      });

      storePicker = createCvsPicker(document.getElementById('storePicker'));
      storePicker.setChain(document.querySelector('input[name="storeType"]:checked').value);

      bindRadios('deliveryMethod', (v) => {
        shippingFields.style.display = v === 'shipping' ? '' : 'none';
        selfFields.style.display = v === 'self' ? '' : 'none';
        updateSummary();
      });
      bindRadios('storeType', (v) => storePicker.setChain(v));
      bindRadios('paymentMethod', (v) => {
        Object.entries(payFields).forEach(([k, el]) => { el.style.display = k === v ? '' : 'none'; });
      });

      // Render summary items
      const itemsHtml = lines.map(l => `
        <div class="summary-item"><span>${l.p.Name} × ${l.qty}</span><span>${fmtPrice(l.lineTotal)}</span></div>
      `).join('');
      document.getElementById('summaryItems').innerHTML = itemsHtml;

      function updateSummary() {
        const dm = (document.querySelector('input[name="deliveryMethod"]:checked') || {}).value || 'shipping';
        const t = calcTotals(lines, dm);
        document.getElementById('sumSub').textContent = fmtPrice(t.subTotal);
        document.getElementById('sumShip').textContent = t.ship === 0 ? '免運' : fmtPrice(t.ship);
        document.getElementById('sumTotal').textContent = fmtPrice(t.grandTotal);
        const remain = Math.max(0, t.threshold - t.subTotal);
        const note = dm === 'self'
          ? '現場自取免運費'
          : (remain > 0 ? `再買 ${fmtPrice(remain)} 即享免運費` : '已享免運費');
        document.getElementById('shipNote').textContent = note;
      }
      updateSummary();

      document.getElementById('checkoutForm').addEventListener('submit', (e) => {
        e.preventDefault();
        handleSubmit(lines);
      });
    }

    async function handleSubmit(lines) {
      const btn = document.getElementById('submitOrderBtn');
      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const email = document.getElementById('customerEmail').value.trim();
      const note = document.getElementById('orderNote').value.trim();
      const dm = document.querySelector('input[name="deliveryMethod"]:checked').value;
      const pm = document.querySelector('input[name="paymentMethod"]:checked').value;

      if (!name) { showToast('請填寫訂購人姓名', 'error'); return; }
      if (!phone || phone.replace(/\D/g, '').length < 8) { showToast('請填寫正確的手機號碼', 'error'); return; }

      let storeInfoFull = '';
      let pickupTime = '';
      let deliveryLabel = '';

      if (dm === 'shipping') {
        const picked = storePicker.getValue();
        if (!picked) { showToast('請選擇收件門市', 'error'); storePicker.focus(); return; }
        const storeType = document.querySelector('input[name="storeType"]:checked').value;
        const storeLabel = CVS_CHAINS[storeType].label;
        const storeText = picked.store
          ? `${picked.store.name} / ${picked.store.id} / ${picked.store.addr}`
          : picked.text;
        const receiver = document.getElementById('receiverName').value.trim();
        storeInfoFull = `${storeLabel} - ${storeText}` + (receiver ? `（收件人：${receiver}）` : '');
        deliveryLabel = '冷凍店到店';
      } else {
        pickupTime = document.getElementById('pickupTime').value.trim();
        if (!pickupTime) { showToast('請填寫預計自取時間', 'error'); return; }
        deliveryLabel = '現場自取';
      }

      let paymentInfo = '';
      let paymentLabel = '';
      if (pm === 'atm') {
        const last5 = document.getElementById('atmLast5').value.trim();
        const date = document.getElementById('atmDate').value;
        if (!/^\d{5}$/.test(last5)) { showToast('請填寫正確的轉帳末 5 碼', 'error'); return; }
        if (!date) { showToast('請填寫轉帳日期', 'error'); return; }
        paymentInfo = `帳號末5碼: ${last5}, 日期: ${date}`;
        paymentLabel = 'ATM轉帳';
      } else if (pm === 'jko') {
        const account = document.getElementById('jkoAccount').value.trim();
        const date = document.getElementById('jkoDate').value;
        if (!account) { showToast('請填寫您的街口帳號或暱稱', 'error'); return; }
        if (!date) { showToast('請填寫付款日期', 'error'); return; }
        paymentInfo = `街口帳號: ${account}, 日期: ${date}`;
        paymentLabel = '街口支付';
      } else {
        const lineName = document.getElementById('linepayName').value.trim();
        const date = document.getElementById('linepayDate').value;
        if (!lineName) { showToast('請填寫付款時的 LINE 顯示名稱', 'error'); return; }
        if (!date) { showToast('請填寫付款日期', 'error'); return; }
        paymentInfo = `LINE 名稱: ${lineName}, 日期: ${date}`;
        paymentLabel = 'LINE Pay';
      }

      const t = calcTotals(lines, dm);
      const itemsStr = lines.map(l => `${l.p.Name}x${l.qty}`).join(', ');
      const orderId = generateOrderId();

      const fullEmail = email ? `, Email: ${email}` : '';
      const fullNote = note + (email ? `\nEmail: ${email}` : '');

      const payload = {
        action: 'createOrder',
        orderId,
        groupLeader: '官網訂單',
        name,
        phone,
        items: itemsStr,
        totalAmount: t.subTotal,
        shippingFee: t.ship,
        grandTotal: t.grandTotal,
        paymentMethod: paymentLabel,
        paymentInfo,
        deliveryMethod: deliveryLabel,
        storeInfo: storeInfoFull,
        pickupTime,
        note: fullNote,
      };

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 送出中...';

      try {
        await submitOrderToGAS(payload);
        clearCart();
        renderSuccess(orderId, payload, t);
      } catch (err) {
        console.error(err);
        showToast('訂單送出失敗，請稍後再試或聯絡客服', 'error');
        btn.disabled = false;
        btn.innerHTML = '確認下單';
      }
    }

    function renderSuccess(orderId, payload, t) {
      const now = new Date();
      const lineMsg = `【我已下單】

📋 訂單編號：${orderId}
👤 訂購人：${payload.name}
📱 電話：${payload.phone}
🛒 訂購內容：${payload.items}
💰 總金額：${fmtPrice(t.grandTotal)}
💳 付款：${payload.paymentMethod}（${payload.paymentInfo}）
🚚 取貨：${payload.deliveryMethod}${payload.storeInfo ? ` - ${payload.storeInfo}` : ''}${payload.pickupTime ? `\n⏰ 預計自取：${payload.pickupTime}` : ''}`;

      const LINE_OA_ID = '@063ifost';
      const lineUrl = `https://line.me/R/oaMessage/${LINE_OA_ID}/?${encodeURIComponent(lineMsg)}`;

      document.getElementById('checkoutContent').innerHTML = `
        <div class="success-card">
          <div class="success-icon">✓</div>
          <h1>訂購完成！</h1>
          <p style="color: var(--ink-soft);">${now.toLocaleString('zh-TW', { hour12: false })} 訂單已送出</p>
          <div class="order-id">訂單編號 <span class="num">${orderId}</span></div>
          <p style="color: var(--ink-mute); font-size: 0.85rem;">之後用「手機號碼＋這個訂單編號」就能在訂單查詢頁看到出貨進度。</p>

          <div class="line-share-section" style="background: linear-gradient(135deg,#06c755,#00b548); padding: 18px; border-radius: var(--r-md); margin: 18px 0; color: white; box-shadow: 0 6px 18px rgba(6,199,85,.25);">
            <p style="margin-bottom: 12px;">📬 請傳送訂單給我們，方便後續對帳與聯繫</p>
            <a href="${lineUrl}" target="_blank" class="btn" style="background: white; color: #06c755; font-weight: 700;">
              傳送訂單給建良
            </a>
            <div style="font-size: 0.8rem; opacity: .85; margin-top: 8px;">尚未加好友？點擊後會引導加入</div>
          </div>

          <div class="success-meta">
            <div class="meta-line"><span class="label">訂購人</span><span class="value">${payload.name}</span></div>
            <div class="meta-line"><span class="label">總金額</span><span class="value" style="color: var(--primary); font-weight: 700;">${fmtPrice(t.grandTotal)}</span></div>
            <div class="meta-line"><span class="label">付款方式</span><span class="value">${payload.paymentMethod}<br><span style="color: var(--ink-mute); font-size: 0.85rem;">${payload.paymentInfo}</span></span></div>
            <div class="meta-line"><span class="label">取貨方式</span><span class="value">${payload.deliveryMethod}${payload.storeInfo ? '<br>' + payload.storeInfo : ''}${payload.pickupTime ? '<br>預計自取：' + payload.pickupTime : ''}</span></div>
            <div class="meta-line" style="display:block;"><span class="label" style="display:block; margin-bottom: 6px;">訂購內容</span><span class="value" style="text-align:left;">${payload.items.split(', ').map(s => '• ' + s).join('<br>')}</span></div>
          </div>

          <div style="background: #fff3cd; color: #856404; padding: 10px 14px; border-radius: var(--r-sm); display: inline-block; margin: 12px 0; font-size: 0.9rem;">
            📸 請截圖保存此畫面，方便後續對帳
          </div>

          <div style="margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <a href="tracking.html" class="btn btn-ghost">查詢我的訂單</a>
            <a href="index.html" class="btn btn-primary">回到首頁</a>
          </div>
        </div>
      `;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    (async function () {
      const data = await fetchShop();
      allProducts = data.products;
      shopSettings = data.settings;
      renderCheckout();
    })();
  </script>
</body>
</html>
